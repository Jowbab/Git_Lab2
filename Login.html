<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg-start: #0f172a;
        --bg-end: #1e293b;
        --panel: rgba(15, 23, 42, 0.75);
        --panel-light: rgba(255, 255, 255, 0.08);
        --primary: #8b5cf6;
        --primary-dark: #7c3aed;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --input: rgba(148, 163, 184, 0.12);
        --success: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        color: var(--text);
      }

      .login-shell {
        width: min(900px, 90vw);
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        border-radius: 24px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
      }

      .brand-panel {
        padding: 48px 40px;
        background: linear-gradient(160deg, rgba(139, 92, 246, 0.25), rgba(30, 41, 59, 0.2));
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #cbd5e1;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-badge::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 18px rgba(34, 197, 94, 0.9);
      }

      h1 {
        font-size: clamp(2.2rem, 3vw, 3.2rem);
        line-height: 1.1;
        margin: 24px 0 16px;
      }

      .brand-panel p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1rem;
        max-width: 28ch;
      }

      .feature-list {
        margin-top: 28px;
        display: grid;
        gap: 14px;
      }

      .feature-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #dbeafe;
      }

      .feature-item .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a78bfa, #60a5fa);
        box-shadow: 0 0 18px rgba(167, 139, 250, 0.8);
      }

      .form-panel {
        padding: 42px 34px;
        background: rgba(15, 23, 42, 0.8);
      }

      .form-panel h2 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .subtitle {
        margin: 0 0 28px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.86rem;
        color: #cbd5e1;
      }

      input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        background: var(--input);
        color: var(--text);
        padding: 14px 16px;
        font-size: 0.98rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: rgba(139, 92, 246, 0.9);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .remember input {
        width: auto;
        accent-color: var(--primary);
      }

      a {
        color: #c4b5fd;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 15px 18px;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35);
      }

      button:hover {
        transform: translateY(-1px);
      }

      .divider {
        position: relative;
        text-align: center;
        margin: 6px 0;
      }

      .divider::before {
        content: "";
        position: absolute;
        inset: 50% 0 auto;
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
      }

      .divider span {
        position: relative;
        background: rgba(15, 23, 42, 0.85);
        padding: 0 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .socials {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        box-shadow: none;
      }

      .signup {
        margin-top: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .status {
        min-height: 20px;
        margin-top: -6px;
        font-size: 0.9rem;
        color: #86efac;
      }

      @media (max-width: 720px) {
        .login-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel,
        .form-panel {
          padding: 28px 22px;
        }

        .socials {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="brand-panel">
        <div class="brand-badge">Secure Portal</div>
        <h1>Welcome back</h1>
        <p>
          Manage your workspace, projects, and team updates from one protected dashboard.
        </p>

        <div class="feature-list">
          <div class="feature-item"><span class="dot"></span> Real-time activity tracking</div>
          <div class="feature-item"><span class="dot"></span> Team collaboration tools</div>
          <div class="feature-item"><span class="dot"></span> Enterprise-level security</div>
        </div>
      </div>

      <div class="form-panel">
        <h2>Sign in</h2>
        <p class="subtitle">Use your account details to continue</p>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required />
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" />
              Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit">Sign In</button>
          <div class="status" id="status" aria-live="polite"></div>

          <div class="divider"><span>or continue with</span></div>

          <div class="socials">
            <button type="button" class="social-btn">Google</button>
            <button type="button" class="social-btn">GitHub</button>
          </div>
        </form>

        <div class="signup">
          New here? <a href="#">Create an account</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const status = document.getElementById('status');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
          status.textContent = 'Please enter both email and password.';
          status.style.color = '#fca5a5';
          return;
        }

        status.textContent = 'Login successful! Redirecting...';
        status.style.color = '#86efac';
      });
    </script>
  </body>
</html>
